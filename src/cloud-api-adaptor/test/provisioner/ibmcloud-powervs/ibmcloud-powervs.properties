IBMCLOUD_API_KEY=""        # Can either be set here or be injected as an environment variable.
IBMCLOUD_ACCOUNT_ID=""
POWERVS_ZONE=""
POWERVS_SERVICE_INSTANCE_ID=""
POWERVS_IMAGE_ID=""        # Peer-pod VM image ID in the PowerVS workspace
POWERVS_NETWORK_ID=""      # Network ID corresponding to Network Name on the PowerVS workspace
POWERVS_SSH_KEY_NAME=""

# CAA instance spec
POWERVS_MEMORY=""          # Defaults to 2GiB
POWERVS_PROCESSORS=""      # Defaults to 0.5C.
POWERVS_PROCESSOR_TYPE=""  # Defaults to "shared", Options: "shared/dedicated"
POWERVS_SYSTEM_TYPE=""     # Defaults to "s1022". Options: "s922,s1022,s1122,e980,e1080" based on the Datacenter capabilities.

# Kind cluster configuration for the BYOM based cluster.
CLUSTER_NAME=""            # Defaults to "peer-pods-e2e"
# Kind cluster configuration file path (relative to the go test working directory, i.e. src/cloud-api-adaptor/test/e2e/, or absolute path)
KIND_CONFIG_FILE="../../ibmcloud-powervs/e2e/kind-config.yaml"
CONTAINER_RUNTIME=""       # Defaults to "containerd"

# Extending the variables over to src/cloud-api-adaptor/install/charts/peerpods/providers/ibmcloud-powervs.yaml
PROXY_TIMEOUT=""           # Defaults to "15m"
USE_PUBLIC_IP=""           # Defaults to "false"
FORWARDER_PORT=""          # Defaults to "15150"
