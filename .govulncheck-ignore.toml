# .govulncheck-ignore.toml
#
# Ignore list for hack/govulncheck.sh.
# Add [[IgnoredVulns]] entries to suppress specific govulncheck vulnerability
# IDs that are known false-positives or have no upstream fix available yet.
#
# Format:
#
#   [[IgnoredVulns]]
#   id = "GO-YYYY-NNNN"
#   reason = "Why this is suppressed"
#
# Optionally add ignoreUntil (TOML local date). An expired entry still suppresses
# the finding but prints a warning so the team knows to review it:
#
#   [[IgnoredVulns]]
#   id = "GO-YYYY-NNNN"
#   reason = "Waiting for upstream patch"
#   ignoreUntil = 2026-12-31

# All three vulns below affect github.com/containerd/containerd@v1.7.33 via the
# CRI checkpoint/restore feature. CAA does not expose that feature, so they are
# not exploitable in this codebase. No fix is available upstream at this time.

[[IgnoredVulns]]
id = "GO-2026-5622"
reason = "Arbitrary host CRI log file read via symlink in containerd. Not exploitable in CAA: CRI checkpoint/restore is not exposed."

[[IgnoredVulns]]
id = "GO-2026-5338"
reason = "CRI checkpoint import allows local image tag poisoning in containerd. Not exploitable in CAA: CRI checkpoint/restore is not exposed."

[[IgnoredVulns]]
id = "GO-2026-5064"
reason = "containerd CRI checkpoint restore CDI annotation smuggling. Not exploitable in CAA: CRI checkpoint/restore is not exposed."

# The vulnerabilities below affect the Go standard library and golang.org/x/net
# prior to Go 1.26.9 / golang.org/x/net v0.60.0 (October 2026 security release).
# Suppressed pending a repository-wide toolchain upgrade to Go 1.26.9.

[[IgnoredVulns]]
id = "GO-2026-6599"
reason = "Reset context tracking on consecutive template expressions in html/template (fixed in Go 1.26.9). Suppressed pending repository toolchain update."

[[IgnoredVulns]]
id = "GO-2026-6600"
reason = "Recognize yield as regexp preceder keyword in html/template (fixed in Go 1.26.9). Suppressed pending repository toolchain update."

[[IgnoredVulns]]
id = "GO-2026-6603"
reason = "HTTP/2 server memory exhaustion due to Trailer headers in net/http / golang.org/x/net (fixed in v0.60.0). Suppressed pending dependency update."

[[IgnoredVulns]]
id = "GO-2026-6605"
reason = "HTTP/1 client connection desynchronization after CONNECT rejection in net/http (fixed in Go 1.26.9). Suppressed pending repository toolchain update."

[[IgnoredVulns]]
