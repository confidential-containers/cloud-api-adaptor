# Run alibabacloud e2e tests.
name: (Callable) alibabacloud e2e tests

on:
  workflow_call:
    inputs:
      podvm_image:
        required: true
        type: string
      caa_image:
        required: true
        type: string
      git_ref:
        default: 'main'
        description: Git ref to checkout the cloud-api-adaptor repository. Defaults to main.
        required: false
        type: string
      peerpod_ctrl_image:
        description: The peerpod-ctrl OCI image (including tag)
        required: false
        default: ''
        type: string
      webhook_image:
        description: The peer-pods-webhook OCI image (including tag)
        required: false
        default: ''
        type: string
      cluster_type:
        description: Specify the cluster type. Accepted value is "onprem".
        default: onprem
        required: false
        type: string
      container_runtime:
        default: 'containerd'
        description: Name of the container runtime. Either containerd or crio.
        required: false
        type: string
    secrets:
      ALIBABA_CLOUD_ROLE_ARN:
        required: true
      ALIBABA_CLOUD_OIDC_PROVIDER_ARN:
        required: true

permissions: {}

env:
  CLOUD_PROVIDER: alibabacloud
  DEBIAN_FRONTEND: noninteractive

jobs:
  # Check the org/repository has Alibaba Cloud OIDC secrets. On absence of
  # secrets it should skip the execution of the test job.
  alibabacloud-credentials:
    name: Check Alibaba Cloud credentials
    runs-on: ubuntu-22.04
    outputs:
      has_secrets: ${{ steps.check_secrets.outputs.has_secrets }}
    steps:
      - name: Check secrets
        id: check_secrets
        env:
          ALIBABA_CLOUD_ROLE_ARN: ${{ secrets.ALIBABA_CLOUD_ROLE_ARN }}
          ALIBABA_CLOUD_OIDC_PROVIDER_ARN: ${{ secrets.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
        run: |
         if [[ -n "${ALIBABA_CLOUD_ROLE_ARN}" && -n "${ALIBABA_CLOUD_OIDC_PROVIDER_ARN}" ]]; then
           echo "has_secrets=true" >> "$GITHUB_OUTPUT"
         else
           echo "has_secrets=false" >> "$GITHUB_OUTPUT"
         fi

  test-alibabacloud:
    name: "Alibaba Cloud e2e tests: (${{ inputs.cluster_type }}, ${{ inputs.container_runtime }})"
    needs: alibabacloud-credentials
    if: needs.alibabacloud-credentials.outputs.has_secrets == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src/cloud-api-adaptor
    env:
        CAA_IMAGE: "${{ inputs.caa_image }}"
        CLUSTER_TYPE: "${{ inputs.cluster_type }}"
        CONTAINER_RUNTIME: "${{ inputs.container_runtime }}"
        PEERPOD_CTRL_IMAGE: "${{ inputs.peerpod_ctrl_image }}"
        PODVM_IMAGE: "${{ inputs.podvm_image }}"
        RESOURCES_BASENAME: "ci-caa-${{ github.run_id }}-${{ github.run_attempt }}"
        WEBHOOK_IMAGE: "${{ inputs.webhook_image }}"
        REGION: "cn-hongkong"
        PODVM_INSTANCE_TYPE: "ecs.g8i.xlarge"
    permissions:
      id-token: write # Required by aliyun/configure-aliyun-credentials-action
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Rebase the code
        if: github.event_name == 'pull_request_target'
        working-directory: ./
        run: |
          ./hack/ci-helper.sh rebase-atop-of-the-latest-target-branch

      - name: Remove unnecessary directories to free up space
        working-directory: ./
        run: |
          sudo ./hack/ci-helper.sh clean-up-runner

      - name: Read properties from versions.yaml
        run: |
          sudo snap install yq
          go_version="$(yq '.tools.golang' versions.yaml)"
          [ -n "$go_version" ]
          {
            echo "GO_VERSION=${go_version}"
            echo "ORAS_VERSION=$(yq -e '.tools.oras' versions.yaml)"
            echo "HELM_VERSION=$(yq -e '.tools.helm.version' versions.yaml)"
            echo "HELM_CHECKSUM=$(yq -e '.tools.helm.sha256' versions.yaml)"
          } >> "$GITHUB_ENV"

      - name: Setup Golang version ${{ env.GO_VERSION }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
          cache: false

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Get qcow2 file from ${{ inputs.podvm_image }}
        run: |
          oras pull "${PODVM_IMAGE}"
          tar xvJpf podvm.tar.xz
          qcow2=$(find ./*.qcow2)
          echo "PODVM_QCOW2=$(pwd)/${qcow2}" >> "$GITHUB_ENV"
        working-directory: src/cloud-api-adaptor/podvm

      - name: Install kustomize
        run: |
          command -v kustomize >/dev/null || \
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | \
            sudo bash -s /usr/local/bin

      - name: Install Helm
        run: |
          curl -fsSL -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_CHECKSUM}  helm.tar.gz" | sha256sum --check --strict
          tar -xzf helm.tar.gz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          rm -rf helm.tar.gz linux-amd64
          helm version

      - name: Config alibabacloud
        run: |
          cat <<EOF>>alibabacloud.properties
          CAA_IMAGE="${CAA_IMAGE}"
          container_runtime="${CONTAINER_RUNTIME}"
          disablecvm="false"
          cluster_type="${CLUSTER_TYPE}"
          resources_basename="${RESOURCES_BASENAME}"
          region="${REGION}"
          podvm_instance_type="${PODVM_INSTANCE_TYPE}"
          EOF
          # For debugging
          echo "::group::alibabacloud.properties"
          cat alibabacloud.properties
          echo "::endgroup::"

      - name: Configure Alibaba Cloud credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          role-to-assume: ${{ secrets.ALIBABA_CLOUD_ROLE_ARN }}
          oidc-provider-arn: ${{ secrets.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          role-session-name: github-actions-caa-e2e
          role-session-expiration: 3600

      - name: Create on-prem cluster
        if: inputs.cluster_type == 'onprem'
        run: |
          # Let's use kcli to build a kubeadm cluster for us
          echo "::group::Configure libvirt"
          ./libvirt/config_libvirt.sh
          # Add the kcli install directory to PATH for later steps
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          echo "::endgroup::"
          echo "::group::Create cluster with $CONTAINER_RUNTIME"
          ./libvirt/kcli_cluster.sh create
          echo "KUBECONFIG=$HOME/.kcli/clusters/peer-pods/auth/kubeconfig" >> "$GITHUB_ENV"
          echo "::endgroup::"

      - name: run tests
        id: runTests
        run: |
          export CLOUD_PROVIDER=alibabacloud
          export DEPLOY_KBS=false
          export TEST_PROVISION="yes"
          export TEST_TEARDOWN="yes"
          export TEST_PROVISION_FILE="$PWD/alibabacloud.properties"
          export TEST_PODVM_IMAGE="${PODVM_QCOW2}"
          export TEST_E2E_TIMEOUT="90m"

          make test-e2e

      - name: Debug tests failure
        if: failure() && steps.runTests.outcome == 'failure'
        working-directory: ./
        timeout-minutes: 5
        run: |
          ./hack/ci-e2e-debug-fail.sh
        # Avoid running with `set -e` as command fails should be allowed
        shell: bash {0}

        # In case the tests execution failed and deprovision code from e2e
        # didn't run, let's try to delete any resources created.
      - name: Force Alibaba Cloud clean-up
        if: failure() && steps.runTests.outcome == 'failure'
        working-directory: ./
        run: |
          ./hack/ci-e2e-alibabacloud-cleanup.sh
        # Avoid running with `set -e` as command fails should be allowed
        shell: bash {0}
