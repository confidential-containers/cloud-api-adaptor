#
# Build and push the pod VM images.
---
name: Publish pod VM Images
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      git_ref:
        description: 'Git ref to build from'
        required: false
        type: string
        default: ''
      image_tag:
        description: 'Image tag to use'
        required: false
        type: string
        default: ''
      debug:
        description: 'Build debug image'
        required: false
        type: boolean
        default: false
    outputs:
      oci-image:
        description: The location of the oci image this workflow has pushed
        value: ${{ jobs.podvm.outputs.qcow2_oras_image }}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-publish-podvm-${{ github.event.pull_request.number || inputs.git_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  podvm:
    uses: $/.github/workflows/podvm_mkosi.yaml
    permissions:
      contents: read  # Required to checkout code
      packages: write  # Required to push container images
      id-token: write  # Required for OIDC authentication
      attestations: write  # Required to write attestations
      artifact-metadata: write  # Required by podvm_mkosi.yaml to write attestation metadata
    strategy:
      fail-fast: false
      matrix:
        target:
        - { arch: amd64, tee-platform: all }
        - { arch: s390x, tee-platform: none }
        - { arch: arm64, tee-platform: none }
    with:
      git_ref: ${{ inputs.git_ref || github.sha }}
      image_tag: ${{ inputs.image_tag || github.sha }}
      arch: ${{ matrix.target.arch}}
      tee-platform: ${{ matrix.target.tee-platform }}
      debug: ${{ inputs.debug }}
