name: Create Test Images

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'src/cloud-api-adaptor/test/e2e/fixtures/Dockerfile.*'
      - '.github/workflows/test-images.yaml'

defaults:
  run:
    working-directory: src/cloud-api-adaptor

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  list-dockerfiles:
    name: list-dockerfiles
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ env.MATRIX }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: set-matrix
        run: echo "MATRIX=$(find test/e2e/fixtures/Dockerfile.* | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_ENV"
  build:
    name: Create Test Images
    needs: list-dockerfiles
    runs-on: ubuntu-24.04
    environment: production
    strategy:
      fail-fast: false
      matrix:
        targets: ${{ fromJson(needs.list-dockerfiles.outputs.matrix) }}
        arch: [amd64, s390x, arm64]
    permissions:
      contents: read  # Required to checkout code
      packages: write  # Required to push container images
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Login to Quay container Registry
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      with:
        registry: quay.io
        username: ${{ vars.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}
    - name: determine docker tag by splitting branch name on slash
      id: docker-tag
      shell: bash
      env:
        MATRIX_TARGET: ${{ matrix.targets }}
      run: |
        file_name=$(basename "${MATRIX_TARGET}")
        echo "DOCKER_TAG=${file_name##*.}" >> "$GITHUB_ENV"
    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        tags: |
          quay.io/confidential-containers/test-images:${{env.DOCKER_TAG}}
        push: true
        context: src/cloud-api-adaptor/
        platforms: linux/s390x,linux/amd64,linux/arm64
        file: src/cloud-api-adaptor/${{matrix.targets}}
        build-args: |
          "ARCH=${{ matrix.arch }}"
